<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>登录 - 智能选座与导航系统</title>
  <link href="/static/vendor/fontawesome/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="static/css/base.css">
  <link rel="stylesheet" href="static/css/animations.css">
  <link rel="stylesheet" href="static/css/pages/login.css">
  <link rel="stylesheet" href="static/css/pages/card-spotlight.css">
</head>

<body>
  <div class="login-page" id="app" v-cloak>
    <div class="login-card">
      <h2><i class="fas fa-map-marked-alt login-icon"></i></h2>
      <h2>智座</h2>
      <p class="subtitle">公共空间 · 智能调度</p>

      <div class="login-tabs">
        <button :class="{active: tab === 'login'}" @click="tab='login';error=''">登录</button>
        <button :class="{active: tab === 'register'}" @click="tab='register';error=''">注册</button>
      </div>

      
      <div class="login-error" :class="{show: error}">${ error }</div>

      <form v-if="tab==='login'" @submit.prevent="doLogin" autocomplete="on">
        <div class="form-group">
          <label>账号</label>
          <input class="form-control" name="username" v-model="studentId" placeholder="请输入账号" required
                 autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input class="form-control" type="password" name="password" v-model="password" placeholder="请输入密码" required
                 autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false">
        </div>
        <button class="btn btn-primary btn-lg btn-block" :disabled="loading">
          <i class="fas" :class="loading?'fa-spinner fa-spin':'fa-sign-in-alt'"></i>
          ${ loading ? '登录中...' : '登 录' }
        </button>
      </form>

      <form v-if="tab==='register'" @submit.prevent="doRegister">
        <div class="form-group">
          <label>注册身份 <span style="color:#d93025">*</span></label>
          <select class="form-control" v-model="role">
            <option value="student">学生（需填写所属学校）</option>
            <option value="user">普通用户（不绑定学校）</option>
            <option value="school_admin">学校管理员（需填写所属学校 · 需审核）</option>
            <option value="admin">管理员（不绑定学校 · 需审核）</option>
          </select>
          <span class="text-muted" style="font-size:12px">
            学生只能查看与预约本校场所；普通用户不绑定学校。
          </span>
        </div>
        <div class="form-group" v-if="needSchool">
          <label>所属学校 <span style="color:#d93025">*</span></label>
          <input class="form-control" v-model.trim="schoolName" list="schoolOptions"
                 placeholder="可直接输入学校名称，或从下拉中选择" autocomplete="off">
          <datalist id="schoolOptions">
            <option v-for="sc in schools" :key="sc.id" :value="sc.name"></option>
          </datalist>
          <span class="text-muted" style="font-size:12px">
            下拉里是已有学校；<b>也可以直接手动输入</b>，输入新学校会自动创建。
          </span>
        </div>
        <div class="form-group">
          <label>账号</label>
          <input class="form-control" name="new-username" v-model="studentId" placeholder="请输入账号" required
                 autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
        </div>
        <div class="form-group">
          <label>姓名</label>
          <input class="form-control" name="name" v-model="name" placeholder="请输入姓名" required
                 autocomplete="off" autocorrect="off" spellcheck="false">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input class="form-control" type="password" name="new-password" v-model="password"
                 placeholder="至少6位密码" required minlength="6"
                 autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false">
        </div>
        <div class="form-group">
          <label>确认密码</label>
          <input class="form-control" type="password" name="confirm-password" v-model="confirmPassword"
            placeholder="再次输入密码" required minlength="6"
            autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false">
        </div>
        <button class="btn btn-success btn-lg btn-block" :disabled="loading">
          <i class="fas" :class="loading?'fa-spinner fa-spin':'fa-user-plus'"></i>
          ${ loading ? '注册中...' : '注 册' }
        </button>
      </form>
    </div>
  </div>

  <script src="/static/vendor/vue.global.prod.js"></script>
  <script src="/static/vendor/axios.min.js"></script>
  <script src="static/js/api-client.js"></script>
  <script src="static/js/mock-api.js"></script>
  <script src="static/js/card-spotlight.js"></script>
  <script src="static/js/login.js"></script>
  <script>
    /* 手机软键盘会盖住登录卡片：聚焦时把输入框滚到可视区中间。
       viewport 里加了 interactive-widget=resizes-content（键盘弹出时
       让 WebView 真的缩短而不是盖在上面），这里再补一层保险。 */
    (function () {
      function keepVisible(el) {
        if (!el) return;
        setTimeout(function () {
          try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
          catch (e) { el.scrollIntoView(); }
        }, 300);
      }
      document.addEventListener('focusin', function (e) {
        var t = e.target;
        if (t && t.tagName === 'INPUT') keepVisible(t);
      });
      // 键盘收起后回到顶部，避免页面停在滚动过的位置
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () {
          var a = document.activeElement;
          if (a && a.tagName === 'INPUT') keepVisible(a);
        });
      }
    })();
  </script>
</body>

</html>
