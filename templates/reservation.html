<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的预约</title>
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="static/css/base.css">
  <link rel="stylesheet" href="static/css/animations.css">
  <link rel="stylesheet" href="static/css/utilities.css">
  <link rel="stylesheet" href="static/css/pages/reservation.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-brand"><i class="fas fa-map-marked-alt"></i> 智能选座与导航</div>
    <button class="hamburger" onclick="document.querySelector('.nav-links').classList.toggle('open')"><i class="fas fa-bars"></i></button>
    <ul class="nav-links">
      <a href="index.html"><i class="fas fa-home"></i> 首页</a>
      <a href="seat-map.html"><i class="fas fa-chair"></i> 座位图</a>
      <a href="reservation.html" class="active"><i class="fas fa-calendar-check"></i> 预约</a>
      <a href="navigation.html"><i class="fas fa-directions"></i> 导航</a>
      <a href="admin-dashboard.html"><i class="fas fa-cog"></i> 设置</a>
    </ul>
    <div class="user-info">
      <a href="profile.html" class="user-info-link" title="个人中心"><div class="avatar"><i class="fas fa-user"></i></div><span class="user-name">演示用户</span></a>
      <span class="role-badge admin">管理员</span>
      <button class="logout-btn" onclick="location.href='login.html'">退出</button>
    </div>
  </nav>
  <div class="container">
    <div id="app" v-cloak>
      <div class="card">
        <div class="card-title"><i class="fas fa-history"></i> 我的预约</div>
        <div v-if="reservations.length">
          <div v-for="r in reservations" :key="r.id" class="booking-row">
            <div><strong>${ r.seat_label || '座位' }</strong> <span class="text-muted ml-2">${ fmt(r.start_time) } ~ ${ fmt(r.end_time) }</span></div>
            <div class="flex gap-2 items-center">
              <span :class="'tag tag-' + (r.status==='pending' ? 'locked' : r.status==='checked_in' ? 'occupied' : 'free')">${ r.status_text || r.status }</span>
              <button v-if="r.status==='pending'" class="btn btn-sm btn-danger" @click="cancel(r.id)"><i class="fas fa-times"></i> 取消</button>
            </div>
          </div>
        </div>
        <div v-else><p class="text-muted text-center p-3">暂无预约记录</p></div>
      </div>
    </div>
  </div>
  <div id="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="static/js/mock-api.js"></script>
  <script src="static/js/app.js"></script>
  <script src="static/js/reservation.js"></script>
  <script>setTimeout(function () { document.querySelectorAll('[v-cloak]').forEach(function (el) { el.removeAttribute('v-cloak') }) }, 3000)</script>
</body>
</html>
