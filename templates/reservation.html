{% extends "base.html" %}
{% block title %}我的预约{% endblock %}
{% block head_extra %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/reservation.css') }}">
{% endblock %}
{% block content %}

    <div id="app" v-cloak>
      <div class="card">
        <div class="card-title"><i class="fas fa-history"></i> 我的预约</div>
        <div v-if="reservations.length">
          <div v-for="r in reservations" :key="r.id" class="booking-row">
            <div><strong>${ r.seat_label || '座位' }</strong> <span class="text-muted ml-2">${ fmt(r.start_time) } ~ ${ fmt(r.end_time) }</span></div>
            <div class="flex gap-2 items-center">
              <span :class="'tag tag-' + (r.status==='pending' ? 'locked' : r.status==='checked_in' ? 'occupied' : 'free')">${ r.status_text || r.status }</span>
              <button v-if="r.status==='pending'" class="btn btn-sm btn-danger" @click="cancel(r.id)"><i class="fas fa-times"></i> 取消</button>
            </div>
          </div>
        </div>
        <div v-else><p class="text-muted text-center p-3">暂无预约记录</p></div>
      </div>
    </div>
  {% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/reservation.js') }}"></script>
{% endblock %}
