<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 智能选座与导航系统</title>
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/login.css') }}">
</head>

<body>
  <div class="login-page" id="app">
    <div class="login-card">
      <h2><i class="fas fa-user-plus login-icon"></i></h2>
      <h2>用户注册</h2>
      <p class="subtitle">创建新账号 · 智能选座</p>

      {% if error %}
      <div class="login-error show">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
          <label>用户名</label>
          <input class="form-control" name="username" placeholder="请输入用户名（作为登录账号）" required>
        </div>
        <div class="form-group">
          <label>邮箱</label>
          <input class="form-control" name="email" type="email" placeholder="请输入邮箱" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input class="form-control" type="password" name="password" placeholder="至少6位密码" required minlength="6">
        </div>
        <div class="form-group">
          <label>确认密码</label>
          <input class="form-control" type="password" name="password1" placeholder="再次输入密码" required minlength="6">
        </div>
        <button class="btn btn-success btn-lg btn-block" type="submit">
          <i class="fas fa-user-plus"></i> 注 册
        </button>
      </form>

      <p class="login-footer">
        已有账号？<a href="{{ url_for('login') }}">去登录</a>
      </p>
    </div>
  </div>
</body>

</html>
